<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="togglePassword(this)">Show</button>
    <p id="msg"></p>
    <button id="submit" onclick="()=>{console.log('submit')}">submit</button>
    <script>
        function togglePassword(btn) {
            let input = document.getElementById("password");
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "Hide";
            } else {
                input.type = "password";
                btn.innerText = "Show";
            }
        }
        let input = document.getElementById("password");
        let msg = document.getElementById("msg");
        let submit = document.getElementById("submit");
        submit.disabled = true;
        input.addEventListener("input", () => {
            let password = input.value;
            let hasSmall = false;
            let hasCapital = false;
            let hasNumber = false;
            let hasSpecial = false;
            let space = false;
            for (let ch of password) {
                if (ch >= 'a' && ch <= 'z') hasSmall = true;
                else if (ch >= 'A' && ch <= 'Z') hasCapital = true;
                else if (ch >= '0' && ch <= '9') hasNumber = true;
                else if ("@$!%*?&".includes(ch)) hasSpecial = true;
            }
        space =password.includes(" ");
            submit.disabled = true;
            if (hasSmall && hasCapital && hasNumber && hasSpecial && password.length >= 6) {
                msg.innerText = "Strong Password ";
                msg.style.color = "green";
                submit.disabled = false;
            } else {
                submit.disabled = true;
                if (space) { msg.innerText = "Password should not contain spaces", msg.style.color = "red"; }
                else if(password.length <6) { msg.innerText = "Password must be at least 6 letter", msg.style.color = "red"; }else {
                    msg.innerText = "Password must include at least one lowercase letter, one uppercase letter, one number, and one special character (@$!%*?&).";
                    msg.style.color = "red";
                }
            }
        }
        );
    </script>
</body>

</html>
